[package]
name = "tbce"
version = "0.1.0"
description = "Tools, Branches, Code, Everything"
edition = "2021"
rust-version = "1.88"

[lib]
name = "tbce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
trash = "5"
